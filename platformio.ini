[platformio]
description = CAN Bridge Analyzer — dual-bus CAN 2.0/FD capture, analysis, and bridging tool for the SPUD board.

[env:can-bridge-analyzer]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*>
board_build.filesystem = spiffs

build_flags =
  ; All CAN settings (bus enable, speed, serial mode, WiFi SSID/password)
  ; are configured at runtime via the /config web page and stored in NVS.
  ; Flash once, then configure over WiFi — no build flags required.
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  mathieucarbou/AsyncTCP@^3.2.3
  mathieucarbou/ESPAsyncWebServer@^3.1.1
lib_ignore =
  AsyncTCP_RP2040W
  ESP Async WebServer@1.2.4
  ESPAsyncTCP@1.2.2
  AsyncTCP@1.1.1
  ESP Async WebServer@1.2.3
